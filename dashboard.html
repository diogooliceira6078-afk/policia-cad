<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Policial | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">

    <!-- ALERTA DE PÂNICO GLOBAL -->
    <div id="panicoOverlay" class="hidden fixed inset-0 bg-red-600/30 backdrop-blur-sm z-50 flex items-center justify-center border-8 border-red-600 animate-pulse">
        <div class="bg-red-950 border border-red-500 text-red-200 p-8 rounded-2xl text-center shadow-2xl">
            <h1 class="text-3xl font-black text-red-500 mb-2">⚠️ PÂNICO ATIVADO ⚠️</h1>
            <p id="textoPanico" class="text-sm font-bold mb-4"></p>
            <button onclick="fecharPanico()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-6 py-2 rounded-xl text-xs">Desarmar</button>
        </div>
    </div>

    <!-- TOAST NOTIFICAÇÕES -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-40 space-y-2 pointer-events-none"></div>

    <!-- MENU LATERAL -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4">
        <div class="space-y-4">
            <div>
                <h2 class="text-sm font-black text-white">CAD POLICIAL</h2>
                <p id="infoCorp" class="text-xs text-blue-400 font-bold"></p>
            </div>
            <nav class="space-y-1">
                <button onclick="mudarAba('inicio')" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-medium bg-slate-800 text-blue-400" id="btn-inicio">📊 Início</button>
                <button onclick="mudarAba('procurados')" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-medium" id="btn-procurados">🚨 Procurados</button>
                <button onclick="mudarAba('prisoes')" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-medium" id="btn-prisoes">🔒 Prisões</button>
                <button onclick="mudarAba('veiculos')" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-medium" id="btn-veiculos">🚗 Veículos Apreendidos</button>
                <button onclick="mudarAba('radio')" class="nav-btn w-full text-left px-4 py-2.5 rounded-xl hover:bg-slate-800 text-sm font-medium" id="btn-radio">📻 Rádio PTT</button>
                <div class="pt-4 border-t border-slate-800 space-y-2">
                    <button onclick="acionarPanico()" class="w-full py-2.5 bg-red-600/20 border border-red-500/40 text-red-400 font-bold text-xs rounded-xl">🚨 BOTÃO DE PÂNICO</button>
                    <a href="admin.html" id="btnAdmin" class="hidden block text-center py-2.5 bg-slate-950 border border-slate-800 text-slate-300 font-bold text-xs rounded-xl">⚙️ Alto Comando</a>
                </div>
            </nav>
        </div>
        <div class="border-t border-slate-800 pt-3 flex justify-between items-center text-xs">
            <div>
                <p id="userName" class="font-bold"></p>
                <p id="userCargo" class="text-blue-400"></p>
            </div>
            <button onclick="logout()" class="text-red-400 font-bold px-2.5 py-1 bg-red-950/50 rounded-lg">Sair</button>
        </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-1 p-8 overflow-y-auto">
        
        <!-- INÍCIO -->
        <div id="sec-inicio" class="aba-conteudo space-y-6">
            <h2 class="text-2xl font-black">Painel Geral</h2>
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
                    <p class="text-xs text-slate-400 font-bold">Procurados</p>
                    <h3 id="statProc" class="text-3xl font-black text-blue-400 mt-1">0</h3>
                </div>
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
                    <p class="text-xs text-slate-400 font-bold">Prisões</p>
                    <h3 id="statPris" class="text-3xl font-black text-green-400 mt-1">0</h3>
                </div>
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
                    <p class="text-xs text-slate-400 font-bold">Veículos Apreendidos</p>
                    <h3 id="statVeic" class="text-3xl font-black text-orange-400 mt-1">0</h3>
                </div>
            </div>
        </div>

        <!-- PROCURADOS -->
        <div id="sec-procurados" class="aba-conteudo hidden space-y-4">
            <h2 class="text-2xl font-black">Galeria de Procurados</h2>
            <div id="grelhaProcurados" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- PRISÕES -->
        <div id="sec-prisoes" class="aba-conteudo hidden space-y-4">
            <h2 class="text-2xl font-black">Registar Prisão</h2>
            <form id="formPrisao" class="bg-slate-900 p-6 rounded-xl border border-slate-800 max-w-xl space-y-3">
                <input type="text" id="p_nome" required placeholder="Nome do Detido" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                <input type="text" id="p_crimes" required placeholder="Crimes Cometidos" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                <input type="text" id="p_pena" required placeholder="Tempo de Pena" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                <button type="submit" class="w-full bg-blue-600 py-3 rounded-xl font-bold text-sm">Registar Prisão</button>
            </form>
        </div>

        <!-- VEÍCULOS -->
        <div id="sec-veiculos" class="aba-conteudo hidden space-y-4">
            <h2 class="text-2xl font-black">Veículos Apreendidos</h2>
            <form id="formVeiculo" class="bg-slate-900 p-6 rounded-xl border border-slate-800 max-w-xl space-y-3">
                <input type="text" id="v_modelo" required placeholder="Modelo (Ex: Sultan)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                <input type="text" id="v_placa" required placeholder="Matrícula (Ex: ABC1234)" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                <input type="text" id="v_motivo" required placeholder="Motivo da Apreensão" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm">
                <button type="submit" class="w-full bg-orange-600 py-3 rounded-xl font-bold text-sm">Registar Apreensão</button>
            </form>
            <div id="listaVeiculos" class="space-y-2 max-w-xl"></div>
        </div>

        <!-- RÁDIO PTT -->
        <div id="sec-radio" class="aba-conteudo hidden space-y-6">
            <h2 class="text-2xl font-black">Rádio Walkie-Talkie (PTT)</h2>
            <div class="bg-slate-900 p-8 rounded-xl border border-slate-800 max-w-xl text-center space-y-4">
                <p class="text-sm">Canal Ativo: <b id="lblCanal" class="text-green-400">Canal 1 - Geral</b></p>
                <div class="flex gap-2 justify-center">
                    <button onclick="mudarCanal('Canal 1 - Geral')" class="px-4 py-2 bg-blue-600/20 border border-blue-500 rounded-xl text-xs font-bold text-blue-300">Canal 1</button>
                    <button onclick="mudarCanal('Canal 2 - Tático')" class="px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold">Canal 2</button>
                </div>
                <button id="btnPTT" onmousedown="pttStart()" onmouseup="pttStop()" ontouchstart="pttStart()" ontouchend="pttStop()" 
                    class="w-full py-6 bg-slate-800 border border-slate-700 hover:bg-blue-600 text-white font-black rounded-xl text-sm transition select-none">
                    PRESSIONE PARA FALAR
                </button>
                <p id="micStatus" class="text-xs text-slate-500">Microfone Desligado</p>
            </div>
        </div>

    </main>

    <script>
        const user = localStorage.getItem('cad_user_logado');
        const corp = localStorage.getItem('cad_corp_logada');
        if (!user) window.location.href = 'index.html';

        document.getElementById('userName').textContent = user;
        document.getElementById('userCargo').textContent = localStorage.getItem('cad_cargo_logado') || 'Agente';
        document.getElementById('infoCorp').textContent = `Divisão: ${corp}`;
        if(corp === 'ADMIN' || user === 'admin') document.getElementById('btnAdmin').classList.remove('hidden');

        function mudarAba(id) {
            document.querySelectorAll('.aba-conteudo').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('bg-slate-800', 'text-blue-400'));
            document.getElementById('sec-' + id).classList.remove('hidden');
            document.getElementById('btn-' + id).classList.add('bg-slate-800', 'text-blue-400');
            if(id === 'procurados') carregarProcurados();
            if(id === 'veiculos') carregarVeiculos();
            if(id === 'inicio') atualizarStats();
        }

        function atualizarStats() {
            document.getElementById('statProc').textContent = JSON.parse(localStorage.getItem('cad_procurados') || '[]').length;
            document.getElementById('statPris').textContent = JSON.parse(localStorage.getItem('cad_prisoes') || '[]').length;
            document.getElementById('statVeic').textContent = JSON.parse(localStorage.getItem('cad_veiculos') || '[]').length;
        }

        function mostrarToast(msg) {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'p-3 bg-green-950 border border-green-500 text-green-200 text-xs font-bold rounded-xl shadow-lg';
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // PÂNICO
        function acionarPanico() {
            let msg = `${user} (${corp}) acionou o Botão de Pânico!`;
            localStorage.setItem('cad_panico', msg);
        }
        function fecharPanico() { localStorage.removeItem('cad_panico'); document.getElementById('panicoOverlay').classList.add('hidden'); }
        setInterval(() => {
            let p = localStorage.getItem('cad_panico');
            if(p) {
                document.getElementById('textoPanico').textContent = p;
                document.getElementById('panicoOverlay').classList.remove('hidden');
            }
        }, 1000);

        // PROCURADOS
        if(!localStorage.getItem('cad_procurados')) {
            localStorage.setItem('cad_procurados', JSON.stringify([
                { nome: "Carlos Mendes", crimes: "Tráfico", recompensa: "R$ 50.000" }
            ]));
        }
        function carregarProcurados() {
            let p = JSON.parse(localStorage.getItem('cad_procurados') || '[]');
            let g = document.getElementById('grelhaProcurados');
            g.innerHTML = p.map(x => `<div class="bg-slate-900 p-4 rounded-xl border border-slate-800"><h4 class="font-bold text-white">${x.nome}</h4><p class="text-xs text-slate-400">Crimes: ${x.crimes}</p><p class="text-xs text-green-400 mt-1">${x.recompensa}</p></div>`).join('');
        }

        // PRISÕES
        document.getElementById('formPrisao').addEventListener('submit', function(e) {
            e.preventDefault();
            let prisoes = JSON.parse(localStorage.getItem('cad_prisoes') || '[]');
            prisoes.push({ nome: document.getElementById('p_nome').value, crimes: document.getElementById('p_crimes').value });
            localStorage.setItem('cad_prisoes', JSON.stringify(prisoes));
            mostrarToast("Prisão registada com sucesso!");
            this.reset();
        });

        // VEÍCULOS
        document.getElementById('formVeiculo').addEventListener('submit', function(e) {
            e.preventDefault();
            let veic = JSON.parse(localStorage.getItem('cad_veiculos') || '[]');
            veic.push({ modelo: document.getElementById('v_modelo').value, placa: document.getElementById('v_placa').value, motivo: document.getElementById('v_motivo').value });
            localStorage.setItem('cad_veiculos', JSON.stringify(veic));
            mostrarToast("Veículo apreendido!");
            this.reset();
            carregarVeiculos();
        });

        function carregarVeiculos() {
            let veic = JSON.parse(localStorage.getItem('cad_veiculos') || '[]');
            let d = document.getElementById('listaVeiculos');
            d.innerHTML = veic.map(v => `<div class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs"><b class="text-orange-400">${v.modelo}</b> (${v.placa}) — Motivo: ${v.motivo}</div>`).join('');
        }

        // RÁDIO PTT
        function mudarCanal(c) {
            document.getElementById('lblCanal').textContent = c;
            mostrarToast("Mudou para: " + c);
        }
        async function pttStart() {
            document.getElementById('micStatus').textContent = "A Transmitir...";
            document.getElementById('micStatus').className = "text-xs text-green-400 font-bold";
            document.getElementById('btnPTT').className = "w-full py-6 bg-red-600 border border-red-500 text-white font-black rounded-xl text-sm transition select-none";
            try { await navigator.mediaDevices.getUserMedia({ audio: true }); } catch(e) {}
        }
        function pttStop() {
            document.getElementById('micStatus').textContent = "Microfone Desligado";
            document.getElementById('micStatus').className = "text-xs text-slate-500";
            document.getElementById('btnPTT').className = "w-full py-6 bg-slate-800 border border-slate-700 hover:bg-blue-600 text-white font-black rounded-xl text-sm transition select-none";
        }

        atualizarStats();
    </script>
</body>
</html>
