<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD - Login Operador</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #090d16; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .box { background-color: #111827; padding: 30px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #1f2937; }
        h2 { color: #3b82f6; text-align: center; margin-bottom: 5px; font-size: 22px; }
        p { text-align: center; color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #d1d5db; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; background-color: #030712; border: 1px solid #374151; border-radius: 6px; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        button.btn-main { width: 100%; padding: 12px; background-color: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button.btn-main:hover { background-color: #1d4ed8; }
        .link-voltar { display: block; text-align: center; margin-top: 15px; color: #60a5fa; font-size: 13px; text-decoration: none; cursor: pointer; }
        .link-voltar:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🛡️ CAD Policial</h2>
        <p>Selecione a corporação e insira os seus dados</p>
        
        <form onsubmit="fazerLogin(event)">
            <div class="input-group">
                <label>Selecione a Polícia / Corporação</label>
                <select id="loginCorp" required>
                    <option value="Polícia Civil">Polícia Civil (PC)</option>
                    <option value="Polícia Militar">Polícia Militar (PM)</option>
                    <option value="PRF">PRF (Rodoviária Federal)</option>
                    <option value="Polícia Federal">Polícia Federal (PF)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Nome de Utilizador</label>
                <input type="text" id="loginUser" placeholder="Ex: proenca" required>
            </div>

            <div class="input-group">
                <label>Palavra-Passe (Pass)</label>
                <input type="password" id="loginPass" placeholder="Ex: 6323" required>
            </div>

            <button type="submit" class="btn-main">Entrar no Sistema</button>
        </form>

        <a class="link-voltar" href="index.html">← Voltar à Central Pública de Ocorrências</a>
    </div>

    <script>
        // Inicializar o utilizador padrão se não existir nenhum
        if (!localStorage.getItem('cadUtilizadoresLista')) {
            localStorage.setItem('cadUtilizadoresLista', JSON.stringify([
                { corporacao: "Polícia Civil", nome: "proenca", senha: "6323" }
            ]));
        }

        function fazerLogin(e) {
            e.preventDefault();
            let corp = document.getElementById('loginCorp').value;
            let user = document.getElementById('loginUser').value.trim().toLowerCase();
            let pass = document.getElementById('loginPass').value;

            let lista = JSON.parse(localStorage.getItem('cadUtilizadoresLista')) || [];
            
            // Verificar se existe o utilizador com esta corporação, nome e pass exatos
            let valido = lista.find(u => u.corporacao === corp && u.nome.toLowerCase() === user && u.senha === pass);

            if (valido) {
                let sessaoInfo = `${corp} - ${valido.nome}`;
                localStorage.setItem('cadUtilizadorLogado', sessaoInfo);
                window.location.href = 'index.html';
            } else {
                alert('Dados incorretos! Verifique a polícia selecionada, o nome de utilizador e a palavra-passe.');
            }
        }
    </script>
</body>
</html>
