<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MDT / CAD Polícia Civil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <h2>POLÍCIA CIVIL / RP</h2>
        <p class="login-subtitle">Insira as suas credenciais para aceder ao sistema</p>
        
        <form onsubmit="fazerLogin(event)">
            <div class="input-group">
                <label>Passaporte ID ou Nome do Agente</label>
                <input type="text" id="loginUser" placeholder="Ex: #0006 ou Thiago" required>
            </div>
            
            <div class="input-group">
                <label>Password (PIN)</label>
                <input type="password" id="loginPass" placeholder="Insira a password" required>
            </div>
            
            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>
        
        <div id="loginErro" style="color: #f87171; font-size: 13px; text-align: center; margin-top: 15px; display: none;">
            Credenciais incorretas ou utilizador não existente. Tente novamente.
        </div>
    </div>

    <script>
        // Função opcional de arranque: garante apenas que o Proença e o Thiago existem se for a primeira vez que abres o site
        function inicializarOficiaisPadrao() {
            let listaOficiais = JSON.parse(localStorage.getItem('listaOficiaisCAD'));
            if (!listaOficiais || listaOficiais.length === 0) {
                listaOficiais = [
                    { id: '#4020', nome: 'Proença', pass: '7576', cargo: 'Alto Comando', estado: 'Ativo' },
                    { id: '#0006', nome: 'Thiago', pass: '1218', cargo: 'Oficial de Patrulha', estado: 'Ativo' }
                ];
                localStorage.setItem('listaOficiaisCAD', JSON.stringify(listaOficiais));
            }
        }

        inicializarOficiaisPadrao();

        function fazerLogin(event) {
            event.preventDefault();
            
            const userInput = document.getElementById('loginUser').value.trim().toLowerCase();
            const passInput = document.getElementById('loginPass').value.trim();
            
            // Lê SEMPRE a lista atualizada do localStorage (incluindo os novos criados na app)
            let listaOficiais = JSON.parse(localStorage.getItem('listaOficiaisCAD')) || [];
            
            // Procura o oficial comparando o nome ou o ID
            const agenteEncontrado = listaOficiais.find(oficial => {
                const idLimpo = oficial.id.toLowerCase().replace('#', '');
                const userLimpo = userInput.replace('#', '');
                
                const correspondeUser = (oficial.nome.toLowerCase() === userInput || idLimpo === userLimpo);
                const correspondePass = (oficial.pass.trim() === passInput);
                
                return correspondeUser && correspondePass;
            });
            
            if (agenteEncontrado) {
                localStorage.setItem('agenteLogado', JSON.stringify(agenteEncontrado));
                window.location.href = 'index.html';
            } else {
                document.getElementById('loginErro').style.display = 'block';
            }
        }
    </script>
</body>
</html>
