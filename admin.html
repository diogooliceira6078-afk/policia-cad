<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD - Painel do Alto Comando</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-10">
    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-black text-red-500">Painel do Alto Comando</h1>
                <p class="text-slate-400 text-sm">Área de acesso restrito e auditoria geral de segurança.</p>
            </div>
            <a href="dashboard.html" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg font-bold text-sm transition">Voltar ao CAD Operacional</a>
        </div>

        <!-- 1. GESTÃO DE CARGOS E PALAVRAS-PASSE -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 mb-8">
            <h2 class="text-xl font-bold mb-4 text-blue-400">Registar ou Atualizar Credenciais de Membros</h2>
            <form id="formAddUser" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <select id="adm_corp" class="bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                    <option value="PM">Polícia Militar (PM)</option>
                    <option value="PC">Polícia Civil (PC)</option>
                    <option value="PF">Polícia Federal (PF)</option>
                    <option value="PRF">PRF</option>
                    <option value="ADMIN">Alto Comando</option>
                </select>
                <input type="text" id="adm_nome" required placeholder="Nome do Agente" class="bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                <input type="text" id="adm_cargo" required placeholder="Cargo (Ex: Coronel / Delegado)" class="bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                <input type="password" id="adm_senha" required placeholder="Palavra-Passe" class="bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                <button type="submit" class="md:col-span-4 bg-blue-600 hover:bg-blue-500 font-bold p-3 rounded-lg transition">Guardar Credenciais no Sistema</button>
            </form>
        </div>

        <!-- 2. PESQUISAR O QUE OS POLICIAIS FIZERAM -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 mb-8">
            <h2 class="text-xl font-bold mb-4 text-blue-400">Auditoria de Atividade por Agente</h2>
            <div class="flex gap-4 mb-4">
                <input type="text" id="inputPesquisaAgente" placeholder="Insira o nome exato do agente (Ex: Soldado Silva)" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg p-3 text-white">
                <button onclick="pesquisarAtividadeAgente()" class="bg-green-600 hover:bg-green-500 font-bold px-6 py-3 rounded-lg transition">Pesquisar Histórico</button>
            </div>
            <div id="resultadoPesquisaAgente" class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-sm text-slate-300 min-h-[100px] max-h-60 overflow-y-auto space-y-2">
                <span class="text-slate-500">Os registos de prisões e ações do agente selecionado aparecerão aqui.</span>
            </div>
        </div>

        <!-- 3. ZONA DE LOGS DO SISTEMA -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <h2 class="text-xl font-bold mb-4 text-red-400">Registo Global de Logs (Audit Trail)</h2>
            <div id="caixaLogs" class="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-xs text-green-400 space-y-1 h-60 overflow-y-auto">
                <!-- Preenchido via JS -->
            </div>
        </div>
    </div>

    <script>
        // Verificar se é admin
        const corpLogada = localStorage.getItem('cad_corp_logada');
        const userLogado = localStorage.getItem('cad_user_logado');
        if (corpLogada !== 'ADMIN' && userLogado?.toLowerCase() !== 'admin') {
            alert('Acesso negado! Área exclusiva para o Alto Comando.');
            window.location.href = 'dashboard.html';
        }

        // Adicionar novo utilizador/pass
        document.getElementById('formAddUser').addEventListener('submit', function(e) {
            e.preventDefault();
            let users = JSON.parse(localStorage.getItem('cad_utilizadores') || '[]');
            users.push({
                corp: document.getElementById('adm_corp').value,
                nome: document.getElementById('adm_nome').value,
                cargo: document.getElementById('adm_cargo').value,
                senha: document.getElementById('adm_senha').value
            });
            localStorage.setItem('cad_utilizadores', JSON.stringify(users));
            alert('Conta de polícia criada com sucesso!');
            this.reset();
        });

        // Pesquisar atividade por agente
        function pesquisarAtividadeAgente() {
            let nomeBusca = document.getElementById('inputPesquisaAgente').value.trim().toLowerCase();
            let container = document.getElementById('resultadoPesquisaAgente');
            container.innerHTML = '';

            if(!nomeBusca) {
                container.innerHTML = '<span class="text-red-400">Por favor, digite o nome de um agente para pesquisar.</span>';
                return;
            }

            let prisoes = JSON.parse(localStorage.getItem('cad_historico_prisoes') || '[]');
            let filtradas = prisoes.filter(p => p.agente.toLowerCase().includes(nomeBusca));

            if(filtradas.length === 0) {
                container.innerHTML = `<span class="text-slate-500">Nenhum registo de prisão encontrado para o agente "${nomeBusca}".</span>`;
                return;
            }

            filtradas.forEach(p => {
                container.innerHTML += `
                    <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
                        <p class="text-blue-400 font-bold">Prisão efetuada a: ${p.nome} (ID: ${p.idCidadao})</p>
                        <p class="text-xs text-slate-400">Crimes: ${p.crimes} | Pena: ${p.pena} | Multa: ${p.multa}</p>
                        <p class="text-[10px] text-slate-500 mt-1">Data: ${p.data} | Corporação: ${p.corp}</p>
                    </div>
                `;
            });
        }

        // Carregar logs
        function carregarLogs() {
            let logs = JSON.parse(localStorage.getItem('cad_logs') || '[]');
            let caixa = document.getElementById('caixaLogs');
            caixa.innerHTML = '';
            if(logs.length === 0) {
                caixa.innerHTML = '<p class="text-slate-500">Sem registos de logs recentes.</p>';
                return;
            }
            logs.forEach(l => {
                caixa.innerHTML += `<p>${l}</p>`;
            });
        }

        carregarLogs();
    </script>
</body>
</html>
