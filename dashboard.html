<script>
        const user = localStorage.getItem('cad_user_logado');
        const corp = localStorage.getItem('cad_corp_logada');
        const cargo = localStorage.getItem('cad_cargo_logado') || 'Agente';
        if (!user) window.location.href = 'index.html';

        document.getElementById('userName').textContent = user;
        document.getElementById('userCargo').textContent = cargo;
        document.getElementById('infoCorp').textContent = `Divisão: ${corp}`;
        document.getElementById('infoCorpMob').textContent = `Divisão: ${corp}`;
        
        if(corp === 'ADMIN' || user === 'admin') {
            document.getElementById('btnAdmin').classList.remove('hidden');
            document.getElementById('btnAuditoria').classList.remove('hidden');
        }

        function toggleMenu() {
            const menu = document.getElementById('sidebarMenu');
            menu.classList.toggle('-translate-x-full');
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        function mudarAba(id) {
            document.querySelectorAll('.aba-conteudo').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('bg-slate-800', 'text-blue-400'));
            document.getElementById('sec-' + id).classList.remove('hidden');
            if(document.getElementById('btn-' + id)) document.getElementById('btn-' + id).classList.add('bg-slate-800', 'text-blue-400');
            
            if(window.innerWidth < 768) toggleMenu();

            if(id === 'procurados') carregarProcurados();
            if(id === 'inicio') atualizarStats();
            if(id === 'auditoria') carregarAuditoria();
        }

        function atualizarStats() {
            document.getElementById('statProc').textContent = JSON.parse(localStorage.getItem('cad_procurados') || '[]').length;
            document.getElementById('statPris').textContent = JSON.parse(localStorage.getItem('cad_prisoes') || '[]').length;
            document.getElementById('statVeic').textContent = JSON.parse(localStorage.getItem('cad_veiculos') || '[]').length;
        }

        function mostrarToast(msg) {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'p-3 bg-slate-900 border border-slate-700 text-slate-100 text-xs font-bold rounded-xl shadow-lg';
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function guardarAuditoria(tipo, detalhes) {
            let logs = JSON.parse(localStorage.getItem('cad_auditoria') || '[]');
            logs.unshift({ data: new Date().toLocaleString(), agente: `${user} (${corp})`, tipo, detalhes });
            localStorage.setItem('cad_auditoria', JSON.stringify(logs));
        }

        function carregarAuditoria() {
            let logs = JSON.parse(localStorage.getItem('cad_auditoria') || '[]');
            let d = document.getElementById('listaAuditoria');
            if(logs.length === 0) { d.innerHTML = `<p class="text-xs text-slate-500">Sem registos.</p>`; return; }
            d.innerHTML = logs.map(l => `<div class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs"><span class="text-blue-400 font-bold">${l.agente}</span> - <b class="text-white">${l.tipo}</b>: ${l.detalhes}</div>`).join('');
        }

        function acionarPanico() {
            localStorage.setItem('cad_panico', `${user} (${corp}) acionou o Pânico!`);
            guardarAuditoria("PÂNICO", "Alerta ativado");
        }
        function fecharPanico() { localStorage.removeItem('cad_panico'); document.getElementById('panicoOverlay').classList.add('hidden'); }
        
        setInterval(() => {
            let p = localStorage.getItem('cad_panico');
            if(p) { document.getElementById('textoPanico').textContent = p; document.getElementById('panicoOverlay').classList.remove('hidden'); }
        }, 1000);

        // Ouve alterações no localStorage em tempo real (caso mude noutra aba ou dispositivo)
        window.addEventListener('storage', (e) => {
            atualizarStats();
            if(!document.getElementById('sec-procurados').classList.contains('hidden')) {
                carregarProcurados();
            }
            if(!document.getElementById('sec-auditoria').classList.contains('hidden')) {
                carregarAuditoria();
            }
        });

        // Valores padrão iniciais se não existirem
        if(!localStorage.getItem('cad_procurados')) {
            localStorage.setItem('cad_procurados', JSON.stringify([]));
        }

        document.getElementById('formProcurado').addEventListener('submit', function(e) {
            e.preventDefault();
            let p = JSON.parse(localStorage.getItem('cad_procurados') || '[]');
            p.push({ id: Date.now(), nome: document.getElementById('proc_nome').value, crimes: document.getElementById('proc_crimes').value, recompensa: document.getElementById('proc_recompensa').value, foto: document.getElementById('proc_foto').value });
            localStorage.setItem('cad_procurados', JSON.stringify(p));
            guardarAuditoria("Mandado", "Emitido novo mandado");
            mostrarToast("Mandado emitido!"); this.reset(); carregarProcurados(); atualizarStats();
        });

        function apagarProcurado(id) {
            let p = JSON.parse(localStorage.getItem('cad_procurados') || '[]');
            localStorage.setItem('cad_procurados', JSON.stringify(p.filter(x => x.id !== id)));
            carregarProcurados(); atualizarStats();
        }

        function carregarProcurados() {
            let p = JSON.parse(localStorage.getItem('cad_procurados') || '[]');
            let grelha = document.getElementById('grelhaProcurados');
            if(p.length === 0) {
                grelha.innerHTML = `<p class="text-xs text-slate-500">Nenhum mandado ativo.</p>`;
                return;
            }
            grelha.innerHTML = p.map(x => `
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                    <div class="flex items-center gap-3">
                        <img src="${x.foto}" class="w-12 h-12 rounded-lg object-cover">
                        <div><h4 class="font-bold text-white">${x.nome}</h4><p class="text-slate-400">${x.crimes} - <span class="text-blue-400">${x.recompensa}</span></p></div>
                    </div>
                    <button onclick="apagarProcurado(${x.id})" class="bg-red-950 text-red-400 px-3 py-1.5 rounded-lg font-bold">Apagar</button>
                </div>
            `).join('');
        }

        // Submissões gerais
        document.getElementById('formPrisao').addEventListener('submit', e => { e.preventDefault(); guardarAuditoria("Prisão", "Registo efetuado"); mostrarToast("Guardado!"); e.target.reset(); });
        document.getElementById('formVeiculo').addEventListener('submit', e => { e.preventDefault(); guardarAuditoria("Veículo", "Apreensão"); mostrarToast("Guardado!"); e.target.reset(); });
        document.getElementById('formOcorrencia').addEventListener('submit', e => { e.preventDefault(); guardarAuditoria("BO", "Ocorrência registada"); mostrarToast("Guardado!"); e.target.reset(); });
        document.getElementById('formArmas').addEventListener('submit', e => { e.preventDefault(); guardarAuditoria("Armas", "Porte emitido"); mostrarToast("Guardado!"); e.target.reset(); });
        document.getElementById('formMultas').addEventListener('submit', e => { e.preventDefault(); guardarAuditoria("Multa", "Coima aplicada"); mostrarToast("Guardado!"); e.target.reset(); });
        document.getElementById('formDrogas').addEventListener('submit', e => { e.preventDefault(); guardarAuditoria("Droga", "Apreensão"); mostrarToast("Guardado!"); e.target.reset(); });
        document.getElementById('formFiancas').addEventListener('submit', e => { e.preventDefault(); guardarAuditoria("Fiança", "Pagamento registado"); mostrarToast("Guardado!"); e.target.reset(); });
        document.getElementById('formFaccao').addEventListener('submit', e => { e.preventDefault(); guardarAuditoria("Facção", "Registo efetuado"); mostrarToast("Guardado!"); e.target.reset(); });

        function mudarCanal(c) { document.getElementById('lblCanal').textContent = c; mostrarToast("Sintonizado: " + c); }
        function mudarCanalCustom() { let v = document.getElementById('inputCanalCustom').value; if(v) mudarCanal(`Canal #${v}`); }
        function pttStart() { document.getElementById('micStatus').textContent = "A Transmitir..."; }
        function pttStop() { document.getElementById('micStatus').textContent = "Em Escuta"; }

        atualizarStats();
        carregarProcurados();
    </script>
