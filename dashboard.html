<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Policial - Painel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex h-screen">

    <!-- Menu Lateral -->
    <div class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col justify-between">
        <div>
            <div class="p-5 text-xl font-bold border-b border-slate-700 text-blue-400">CAD UNIFICADO</div>
            <nav class="p-4 space-y-2">
                <button onclick="mudarAba('prisoes')" class="w-full text-left p-2 rounded hover:bg-slate-700 transition">Registo de Prisão</button>
                <button onclick="mudarAba('mandados')" class="w-full text-left p-2 rounded hover:bg-slate-700 transition">Mandados</button>
                <button onclick="mudarAba('multas')" class="w-full text-left p-2 rounded hover:bg-slate-700 transition">Emitir Multa</button>
                <button onclick="mudarAba('ponto')" class="w-full text-left p-2 rounded hover:bg-slate-700 transition">Bater Ponto</button>
                
                <!-- Botão exclusivo visível apenas para o Alto Comando / Admin -->
                <a href="admin.html" id="btnAdmin" class="hidden block w-full text-left p-2 rounded bg-red-900/50 hover:bg-red-900 transition text-red-300 font-semibold mt-6">Painel Alto Comando</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-700 text-sm">
            <p id="userInfo" class="text-slate-400"></p>
            <button onclick="logout()" class="mt-2 text-red-400 hover:underline text-xs">Terminar Sessão</button>
        </div>
    </div>

    <!-- Área de Conteúdo Dinâmico -->
    <div class="flex-1 p-10 overflow-y-auto">
        
        <!-- SECÇÃO: PRISÕES -->
        <div id="sec-prisoes" class="aba-conteudo">
            <h2 class="text-2xl font-bold mb-4">Registo de Prisão</h2>
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 max-w-2xl">
                <form class="space-y-4" onsubmit="event.preventDefault(); alert('Prisão registada com sucesso!');">
                    <div>
                        <label class="block text-sm mb-1">Nome do Cidadão</label>
                        <input type="text" required class="w-full bg-slate-700 border border-slate-600 rounded p-2" placeholder="Nome completo">
                    </div>
                    <div>
                        <label class="block text-sm mb-1">Crimes / Artigos</label>
                        <textarea required class="w-full bg-slate-700 border border-slate-600 rounded p-2" placeholder="Descreva os crimes cometidos..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm mb-1">Tempo de Pena / Multa (R$)</label>
                        <input type="text" required class="w-full bg-slate-700 border border-slate-600 rounded p-2" placeholder="Ex: 50 meses / 10.000 R$">
                    </div>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-bold">Registar Prisão</button>
                </form>
            </div>
        </div>

        <!-- SECÇÃO: MANDADOS -->
        <div id="sec-mandados" class="aba-conteudo hidden">
            <h2 class="text-2xl font-bold mb-4">Gestão de Mandados</h2>
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700">
                <h3 class="text-lg font-semibold mb-2 text-blue-300">Emitir Novo Mandado de Prisão/Busca</h3>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <input type="text" placeholder="Nome do Alvo" class="bg-slate-700 border border-slate-600 rounded p-2">
                    <input type="text" placeholder="Motivo / Justificativa" class="bg-slate-700 border border-slate-600 rounded p-2">
                </div>
                <button onclick="alert('Mandado emitido com sucesso!')" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-bold">Emitir Mandado</button>
            </div>
        </div>

        <!-- SECÇÃO: MULTAS -->
        <div id="sec-multas" class="aba-conteudo hidden">
            <h2 class="text-2xl font-bold mb-4">Emitir Multa</h2>
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 max-w-2xl">
                <form class="space-y-4" onsubmit="event.preventDefault(); alert('Multa aplicada com sucesso!');">
                    <input type="text" required placeholder="Nome do Condutor / Cidadão" class="w-full bg-slate-700 border border-slate-600 rounded p-2">
                    <input type="text" required placeholder="Motivo da Infração (Ex: Excesso de velocidade)" class="w-full bg-slate-700 border border-slate-600 rounded p-2">
                    <input type="number" required placeholder="Valor (R$)" class="w-full bg-slate-700 border border-slate-600 rounded p-2">
                    <button type="submit" class="bg-yellow-600 hover:bg-yellow-700 px-4 py-2 rounded font-bold text-slate-900">Aplicar Multa</button>
                </form>
            </div>
        </div>

        <!-- SECÇÃO: BATER PONTO -->
        <div id="sec-ponto" class="aba-conteudo hidden">
            <h2 class="text-2xl font-bold mb-4">Controlo de Ponto</h2>
            <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 flex gap-4">
                <button onclick="alert('Entrada em serviço registada!')" class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded font-bold">🟢 Iniciar Turno (Entrar em Serviço)</button>
                <button onclick="alert('Saída de serviço registada!')" class="bg-red-600 hover:bg-red-700 px-6 py-3 rounded font-bold">🔴 Terminar Turno (Sair)</button>
            </div>
        </div>

    </div>

    <script>
        // Proteger a página contra acesso direto sem login
        const user = localStorage.getItem('cad_user');
        const corp = localStorage.getItem('cad_corp');
        const cargo = localStorage.getItem('cad_cargo');

        if (!user) {
            window.location.href = 'index.html';
        }

        document.getElementById('userInfo').innerHTML = `Logado: <b>${user}</b><br><span class="text-xs text-blue-400">${corp} - ${cargo || 'Agente'}</span>`;

        // Mostrar o painel de administração apenas se for a conta Admin ou se tiver cargo de comando
        if (corp === 'ADMIN' || user.toLowerCase() === 'admin') {
            document.getElementById('btnAdmin').classList.remove('hidden');
        }

        function mudarAba(abaID) {
            document.querySelectorAll('.aba-conteudo').forEach(el => el.classList.add('hidden'));
            document.getElementById('sec-' + abaID).classList.remove('hidden');
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
