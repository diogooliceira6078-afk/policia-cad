<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Policial | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center h-screen">
    <div class="bg-slate-900 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-800 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-black text-white">CAD POLICIAL</h1>
            <p class="text-xs text-slate-400 mt-1">Terminal de Acesso Seguro</p>
        </div>
        
        <div id="erroMsg" class="hidden bg-red-950/80 border border-red-600 text-red-300 p-3 rounded-xl text-xs font-semibold text-center"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">Corporação</label>
                <select id="corporacao" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:border-blue-500 outline-none">
                    <option value="PM">Polícia Militar (PM)</option>
                    <option value="PC">Polícia Civil (PC)</option>
                    <option value="PF">Polícia Federal (PF)</option>
                    <option value="PRF">Polícia Rodoviária Federal (PRF)</option>
                    <option value="ADMIN">Alto Comando</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">Nome / Patente</label>
                <input type="text" id="nome" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:border-blue-500 outline-none" placeholder="Ex: Capitão Silva">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">Palavra-Passe</label>
                <input type="password" id="senha" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:border-blue-500 outline-none" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-xl text-sm transition">Entrar no Sistema</button>
        </form>
    </div>

    <script>
        // Lista de utilizadores padrão partilhados universalmente no código
        const utilizadoresPredefinidos = [
            { corp: "ADMIN", nome: "admin", senha: "6323", cargo: "Alto Comando" },
            { corp: "PM", nome: "Comandante Silva", senha: "1234", cargo: "Coronel" },
            { corp: "PC", nome: "Thiago", senha: "1218", cargo: "Capitão" }
        ];

        // Se o localStorage ainda não tiver a lista ou precisar de reset, atualiza com os oficiais correntes
        let usersAtuais = JSON.parse(localStorage.getItem('cad_utilizadores') || '[]');
        
        // Garantir que o Thiago e os oficiais base estão sempre presentes em qualquer dispositivo
        utilizadoresPredefinidos.forEach(def => {
            if (!usersAtuais.some(u => u.corp === def.corp && u.nome.toLowerCase() === def.nome.toLowerCase())) {
                usersAtuais.push(def);
            }
        });
        localStorage.setItem('cad_utilizadores', JSON.stringify(usersAtuais));

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nome = document.getElementById('nome').value.trim();
            const senha = document.getElementById('senha').value;
            const corp = document.getElementById('corporacao').value;
            
            let users = JSON.parse(localStorage.getItem('cad_utilizadores'));

            const match = users.find(u => u.corp === corp && u.nome.toLowerCase() === nome.toLowerCase() && u.senha === senha);

            if (match) {
                localStorage.setItem('cad_user_logado', match.nome);
                localStorage.setItem('cad_corp_logada', match.corp);
                localStorage.setItem('cad_cargo_logado', match.cargo || 'Militar');
                window.location.href = 'dashboard.html';
            } else {
                const erro = document.getElementById('erroMsg');
                erro.textContent = "Credenciais inválidas! Verifique o nome, corporação e palavra-passe.";
                erro.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
