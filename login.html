<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CAD Polícia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="public-container">
        <div class="box">
            <h2>Central de Operações Policiais - CAD</h2>
            <p>Insira as suas credenciais para aceder ao sistema operacional.</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>Nome</label>
                    <input type="text" id="loginUser" placeholder="Nome" required>
                </div>

                <div class="input-group">
                    <label>Sua senha</label>
                    <input type="password" id="loginPass" placeholder="Sua senha" required>
                </div>

                <button type="submit" class="btn-main">Entrar no Sistema CAD</button>
            </form>

            <a class="link-alternativo" href="index.html">← Voltar à Central Pública de Emergência</a>
        </div>
    </div>

    <script>
        // Garante que a conta master proenca / 6323 existe no localStorage
        let listaAtual = JSON.parse(localStorage.getItem('cadUtilizadoresLista')) || [];
        if (!listaAtual.some(u => u.nome.toLowerCase() === 'proenca')) {
            listaAtual.push({
                corporacao: "Polícia Civil",
                nome: "proenca",
                senha: "6323",
                patente: "Delegado Geral",
                cargo: "Alto Comando"
            });
            localStorage.setItem('cadUtilizadoresLista', JSON.stringify(listaAtual));
        }

        // Lógica de submissão do login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            
            let utilizadores = JSON.parse(localStorage.getItem('cadUtilizadoresLista')) || [];
            let encontrado = utilizadores.find(u => u.nome.toLowerCase() === user.toLowerCase() && u.senha === pass);

            if (encontrado) {
                localStorage.setItem('utilizadorLogado', JSON.stringify(encontrado));
                window.location.href = 'index.html';
            } else {
                alert('Nome ou senha incorretos!');
            }
        });
    </script>
</body>
</html>
