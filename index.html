<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Policial - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center h-screen">

    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-96 border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-400">CAD POLICIAL UNIFICADO</h1>
        
        <div id="erroMsg" class="hidden bg-red-900/50 border border-red-500 text-red-300 p-2 rounded mb-4 text-sm text-center"></div>

        <form id="loginForm" class="space-y-4">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Corporação</label>
                <select id="corporacao" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white">
                    <option value="PM">Polícia Militar (PM)</option>
                    <option value="PC">Polícia Civil (PC)</option>
                    <option value="PF">Polícia Federal (PF)</option>
                    <option value="PRF">Polícia Rodoviária Federal (PRF)</option>
                    <option value="ADMIN">Alto Comando / Admin</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Nome / Identificação</label>
                <input type="text" id="nome" required class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white" placeholder="Ex: Soldado Silva">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Palavra-Passe</label>
                <input type="password" id="senha" required class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-2 rounded transition">Entrar no CAD</button>
        </form>

        <div class="mt-4 text-xs text-slate-400 text-center">
            <p>Admin de teste: Nome: <b>admin</b> | Pass: <b>6323</b></p>
        </div>
    </div>

    <script>
        // Base de dados simulada de utilizadores e passes por corporação
        const utilizadoresValidos = [
            { corp: "ADMIN", nome: "admin", senha: "6323", cargo: "Alto Comando" },
            { corp: "PM", nome: "Soldado Silva", senha: "123", cargo: "Soldado PM" },
            { corp: "PC", nome: "Inspetor Santos", senha: "123", cargo: "Inspetor PC" },
            { corp: "PF", nome: "Agente Costa", senha: "123", cargo: "Agente Federal" },
            { corp: "PRF", nome: "Patrulheiro Oliveira", senha: "123", cargo: "Patrulheiro PRF" }
        ];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nomeInput = document.getElementById('nome').value.trim();
            const senhaInput = document.getElementById('senha').value;
            const corpInput = document.getElementById('corporacao').value;
            const erroDiv = document.getElementById('erroMsg');

            // Verificar se as credenciais batem certo
            const utilizadorEncontrado = utilizadoresValidos.find(u => 
                u.corp === corpInput && 
                u.nome.toLowerCase() === nomeInput.toLowerCase() && 
                u.senha === senhaInput
            );

            // Permissão especial para qualquer um usar a pass '6323' no perfil de Admin
            if ((corpInput === "ADMIN" && nomeInput.toLowerCase() === "admin" && senhaInput === "6323") || utilizadorEncontrado) {
                const dadosUser = utilizadorEncontrado || { nome: nomeInput, corp: corpInput, cargo: "Comando" };
                
                localStorage.setItem('cad_user', dadosUser.nome);
                localStorage.setItem('cad_corp', dadosUser.corp);
                localStorage.setItem('cad_cargo', dadosUser.cargo);
                
                window.location.href = 'dashboard.html';
            } else {
                erroDiv.textContent = "Nome, corporação ou palavra-passe incorretos!";
                erroDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
