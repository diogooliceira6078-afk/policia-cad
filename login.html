<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CAD Polícia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .login-box {
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h2 { color: #3b82f6; text-align: center; margin-bottom: 8px; font-size: 22px; }
        p.subtitulo { text-align: center; color: #9ca3af; font-size: 13px; margin-bottom: 25px; }

        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .input-group label { font-size: 13px; color: #9ca3af; font-weight: 500; }
        .input-group input {
            background-color: #1f2937;
            border: 1px solid #374151;
            padding: 12px 15px;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: #3b82f6; }

        .btn-main {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-main:hover { background-color: #1d4ed8; }

        .link-voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #60a5fa;
            font-size: 13px;
            text-decoration: none;
        }
        .link-voltar:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Central Policial - CAD</h2>
        <p class="subtitulo">Insira as suas credenciais para aceder.</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Nome</label>
                <input type="text" id="loginUser" placeholder="Nome" required>
            </div>

            <div class="input-group">
                <label>Sua senha</label>
                <input type="password" id="loginPass" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn-main">Entrar no Sistema CAD</button>
        </form>

        <a class="link-voltar" href="index.html">← Voltar à Central Pública de Emergência</a>
    </div>

    <script>
        // Garante que a conta master existe no sistema para conseguires entrar
        let listaAtual = JSON.parse(localStorage.getItem('cadUtilizadoresLista')) || [];
        if (!listaAtual.some(u => u.nome.toLowerCase() === 'proenca')) {
            listaAtual.push({
                corporacao: "Polícia Civil",
                nome: "proenca",
                senha: "6323",
                patente: "Delegado Geral",
                cargo: "Alto Comando"
            });
            localStorage.setItem('cadUtilizadoresLista', JSON.stringify(listaAtual));
        }

        // Lógica de login com verificação
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            
            let utilizadores = JSON.parse(localStorage.getItem('cadUtilizadoresLista')) || [];
            let encontrado = utilizadores.find(u => u.nome.toLowerCase() === user.toLowerCase() && u.senha === pass);

            if (encontrado) {
                localStorage.setItem('utilizadorLogado', JSON.stringify(encontrado));
                window.location.href = 'index.html';
            } else {
                alert('Nome ou senha incorretos!');
            }
        });
    </script>
</body>
</html>
