<!DOCTYPE html>
<html lang="pt">
<head>
    <charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD - Sistema Policial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-box">
            <!-- Podes trocar o link da imagem pelo brasão da tua polícia -->
            <h2>POLÍCIA CIVIL / RP</h2>
            <p>Sistema Operacional Unificado</p>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Utilizador / Email</label>
                <input type="text" id="email" placeholder="Digite o seu registo ou email" required>
            </div>

            <div class="input-group">
                <label for="password">Palavra-passe</label>
                <input type="password" id="password" placeholder="********" required>
            </div>

            <button type="submit" class="btn-login">Entrar no Sistema</button>
        </form>
    </div>

</body>
</html>
