<!DOCTYPE html>
<html lang="pt" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Policial | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center h-screen">
    <div class="bg-slate-900 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-800">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-white">CAD POLICIAL</h1>
            <p class="text-xs text-slate-400 mt-1">Terminal de Acesso Seguro</p>
        </div>
        
        <div id="erroMsg" class="hidden bg-red-950/80 border border-red-600 text-red-300 p-3 rounded-xl mb-4 text-xs font-semibold text-center"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">Corporação</label>
                <select id="corporacao" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white">
                    <option value="PM">Polícia Militar (PM)</option>
                    <option value="PC">Polícia Civil (PC)</option>
                    <option value="PF">Polícia Federal (PF)</option>
                    <option value="PRF">PRF</option>
                    <option value="ADMIN">Alto Comando</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">Nome / Patente</label>
                <input type="text" id="nome" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" placeholder="Ex: Capitão Silva">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 mb-1">Palavra-Passe</label>
                <input type="password" id="senha" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-xl text-sm transition">Entrar no Sistema</button>
        </form>
        <p class="text-center text-xs text-slate-500 mt-4">Admin Padrão: <b>admin</b> / Palavra-passe: <b>6323</b></p>
    </div>

    <script>
        if (!localStorage.getItem('cad_utilizadores')) {
            localStorage.setItem('cad_utilizadores', JSON.stringify([
                { corp: "ADMIN", nome: "admin", senha: "6323", cargo: "Alto Comando" },
                { corp: "PM", nome: "Soldado Silva", senha: "123", cargo: "Soldado" }
            ]));
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nome = document.getElementById('nome').value.trim();
            const senha = document.getElementById('senha').value;
            const corp = document.getElementById('corporacao').value;
            const users = JSON.parse(localStorage.getItem('cad_utilizadores'));

            const match = users.find(u => u.corp === corp && u.nome.toLowerCase() === nome.toLowerCase() && u.senha === senha);

            if (match || (corp === "ADMIN" && nome.toLowerCase() === "admin" && senha === "6323")) {
                const dados = match || { nome, corp, cargo: "Comando" };
                localStorage.setItem('cad_user_logado', dados.nome);
                localStorage.setItem('cad_corp_logada', dados.corp);
                localStorage.setItem('cad_cargo_logado', dados.cargo);
                window.location.href = 'dashboard.html';
            } else {
                const erro = document.getElementById('erroMsg');
                erro.textContent = "Credenciais inválidas!";
                erro.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
